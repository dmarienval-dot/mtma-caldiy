# Fabrique l'image de cal.diy (version figée) et la dépose sur ghcr.io. Lancement à la main.
name: Fabrication de cal.diy
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  VERSION: ae027bb70e694e2d2c44569f398d6cbcee0389b1
jobs:
  fabrication:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af > /dev/null
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ env.VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/dmarienval-dot/mtma-caldiy:ae027bb
          labels: org.opencontainers.image.source=https://github.com/dmarienval-dot/mtma-caldiy
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://rdv.montempsmonargent.fr
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            ORGANIZATIONS_ENABLED=false
            DATABASE_URL=postgresql://fabrication:fabrication@localhost:5432/fabrication
            NEXTAUTH_SECRET=valeur-de-fabrication
            CALENDSO_ENCRYPTION_KEY=valeur-de-fabrication
            MAX_OLD_SPACE_SIZE=6144
